description: 本地 8 模型 × 24 题评测（经 LiteLLM 网关）
providers:
- id: openai:chat:qwen2.5:1.5b
  config:
    apiBaseUrl: http://localhost:4000/v1
    apiKey: sk-local-eval
    temperature: 0.2
- id: openai:chat:qwen2.5:3b
  config:
    apiBaseUrl: http://localhost:4000/v1
    apiKey: sk-local-eval
    temperature: 0.2
- id: openai:chat:qwen2.5:7b
  config:
    apiBaseUrl: http://localhost:4000/v1
    apiKey: sk-local-eval
    temperature: 0.2
- id: openai:chat:deepseek-r1:1.5b
  config:
    apiBaseUrl: http://localhost:4000/v1
    apiKey: sk-local-eval
    temperature: 0.2
- id: openai:chat:llama3.2:3b
  config:
    apiBaseUrl: http://localhost:4000/v1
    apiKey: sk-local-eval
    temperature: 0.2
- id: openai:chat:gemma2:2b
  config:
    apiBaseUrl: http://localhost:4000/v1
    apiKey: sk-local-eval
    temperature: 0.2
- id: openai:chat:glm4:9b
  config:
    apiBaseUrl: http://localhost:4000/v1
    apiKey: sk-local-eval
    temperature: 0.2
- id: openai:chat:seed-coder-8b
  config:
    apiBaseUrl: http://localhost:4000/v1
    apiKey: sk-local-eval
    temperature: 0.2
prompts:
- '{{question}}'
tests:
- vars:
    question: 一个水果篮里共有苹果和橙子 12 个，苹果比橙子多 4 个。请问苹果和橙子各有多少个？请给出计算过程。
    dimension: reasoning
    hints: 8、4
  assert:
  - type: llm-rubric
    value: 题目维度：{{dimension}}。参考答案要点：{{hints}}。请判断模型回答是否基本正确，回答基本正确则判为通过。
- vars:
    question: 鸡和兔关在同一个笼子里，共有 35 个头、94 只脚。请问鸡和兔各有多少只？
    dimension: reasoning
    hints: 23、12
  assert:
  - type: llm-rubric
    value: 题目维度：{{dimension}}。参考答案要点：{{hints}}。请判断模型回答是否基本正确，回答基本正确则判为通过。
- vars:
    question: 甲、乙、丙三人中只有一个人说真话。甲说“乙在说谎”，乙说“丙在说谎”，丙说“甲和乙都在说谎”。请问谁说真话？请说明推理过程。
    dimension: reasoning
    hints: 乙
  assert:
  - type: llm-rubric
    value: 题目维度：{{dimension}}。参考答案要点：{{hints}}。请判断模型回答是否基本正确，回答基本正确则判为通过。
- vars:
    question: 用 Python 写一个函数 is_prime(n)，判断一个整数是否为素数，并给出 2 个测试示例。
    dimension: code
    hints: def、is_prime、%、return
  assert:
  - type: llm-rubric
    value: 题目维度：{{dimension}}。参考答案要点：{{hints}}。请判断模型回答是否基本正确，回答基本正确则判为通过。
- vars:
    question: 用 Python 实现斐波那契数列，输出前 10 项。
    dimension: code
    hints: def、1, 1, 2、fib
  assert:
  - type: llm-rubric
    value: 题目维度：{{dimension}}。参考答案要点：{{hints}}。请判断模型回答是否基本正确，回答基本正确则判为通过。
- vars:
    question: 用 Python 写一个函数 reverse_string(s)，将字符串反转，例如输入 "hello" 输出 "olleh"。
    dimension: code
    hints: def、reverse、[::-1]
  assert:
  - type: llm-rubric
    value: 题目维度：{{dimension}}。参考答案要点：{{hints}}。请判断模型回答是否基本正确，回答基本正确则判为通过。
- vars:
    question: 日本的首都是哪座城市？
    dimension: knowledge
    hints: 东京、Tokyo
  assert:
  - type: llm-rubric
    value: 题目维度：{{dimension}}。参考答案要点：{{hints}}。请判断模型回答是否基本正确，回答基本正确则判为通过。
- vars:
    question: 水的化学式是什么？
    dimension: knowledge
    hints: H2O、H₂O
  assert:
  - type: llm-rubric
    value: 题目维度：{{dimension}}。参考答案要点：{{hints}}。请判断模型回答是否基本正确，回答基本正确则判为通过。
- vars:
    question: 地球绕太阳公转一周大约需要多少天？
    dimension: knowledge
    hints: '365'
  assert:
  - type: llm-rubric
    value: 题目维度：{{dimension}}。参考答案要点：{{hints}}。请判断模型回答是否基本正确，回答基本正确则判为通过。
- vars:
    question: '请将下面这句话翻译成日语：

      “关于贵公司的产品报价，我们将在本周内确认并回复。”'
    dimension: translation
    hints: 見積、今週、返信
  assert:
  - type: llm-rubric
    value: 题目维度：{{dimension}}。参考答案要点：{{hints}}。请判断模型回答是否基本正确，回答基本正确则判为通过。
- vars:
    question: '请将下面这句日语翻译成中文：

      「本システムの導入により、業務効率の大幅な改善が期待されます。」'
    dimension: translation
    hints: 系统、效率、改善
  assert:
  - type: llm-rubric
    value: 题目维度：{{dimension}}。参考答案要点：{{hints}}。请判断模型回答是否基本正确，回答基本正确则判为通过。
- vars:
    question: '请将下面这句合同条款翻译成日语：

      “本合同自双方签字之日起生效，有效期为三年。”'
    dimension: translation
    hints: 契約、発効、有効期間
  assert:
  - type: llm-rubric
    value: 题目维度：{{dimension}}。参考答案要点：{{hints}}。请判断模型回答是否基本正确，回答基本正确则判为通过。
- vars:
    question: 请严格使用 JSON 格式输出以下信息：你的名称、所在公司、擅长领域。只输出 JSON，不要输出其他任何文字。
    dimension: instruction
    hints: '{、}、name、company'
  assert:
  - type: llm-rubric
    value: 题目维度：{{dimension}}。参考答案要点：{{hints}}。请判断模型回答是否基本正确，回答基本正确则判为通过。
- vars:
    question: 请用 Markdown 无序列表列出三种提高工作效率的方法，每项不超过 10 个字。
    dimension: instruction
    hints: '- 、* '
  assert:
  - type: llm-rubric
    value: 题目维度：{{dimension}}。参考答案要点：{{hints}}。请判断模型回答是否基本正确，回答基本正确则判为通过。
- vars:
    question: 请只回答一个字：是 或 否。问题是：“1+1 等于 2 吗？”
    dimension: instruction
    hints: 是
  assert:
  - type: llm-rubric
    value: 题目维度：{{dimension}}。参考答案要点：{{hints}}。请判断模型回答是否基本正确，回答基本正确则判为通过。
- vars:
    question: '请阅读以下关于智能翻译系统 Smartrans 的介绍，然后回答问题。

      介绍：Smartrans 是一款面向企业客户的智能翻译系统，支持中文、日语、英语等 20 多种语言的互译。该系统于 2023 年上线，目前已服务超过 500 家企业客户，日均翻译量达到 100 万字符。

      问题：Smartrans 目前服务了多少家企业客户？'
    dimension: longtext
    hints: '500'
  assert:
  - type: llm-rubric
    value: 题目维度：{{dimension}}。参考答案要点：{{hints}}。请判断模型回答是否基本正确，回答基本正确则判为通过。
- vars:
    question: '请阅读以下介绍后回答问题。

      介绍：Smartrans 是一款面向企业客户的智能翻译系统，支持中文、日语、英语等 20 多种语言的互译，在金融、法律、IT 等垂直领域表现突出。

      问题：Smartrans 支持多少种语言的互译？'
    dimension: longtext
    hints: '20'
  assert:
  - type: llm-rubric
    value: 题目维度：{{dimension}}。参考答案要点：{{hints}}。请判断模型回答是否基本正确，回答基本正确则判为通过。
- vars:
    question: '请阅读以下介绍后回答问题。

      介绍：Smartrans 是一款面向企业客户的智能翻译系统，该系统于 2023 年上线，日均翻译量达到 100 万字符。

      问题：Smartrans 于哪一年上线？'
    dimension: longtext
    hints: '2023'
  assert:
  - type: llm-rubric
    value: 题目维度：{{dimension}}。参考答案要点：{{hints}}。请判断模型回答是否基本正确，回答基本正确则判为通过。
- vars:
    question: '以下是用户与助手的对话：

      用户：我想了解贵公司的智能翻译产品。

      助手：您好，我们的 Smartrans 产品支持 20 多种语言互译。

      用户：它在金融领域的表现如何？

      问题：用户最后一句中的「它」指的是什么？'
    dimension: dialog
    hints: Smartrans
  assert:
  - type: llm-rubric
    value: 题目维度：{{dimension}}。参考答案要点：{{hints}}。请判断模型回答是否基本正确，回答基本正确则判为通过。
- vars:
    question: '对话：

      甲：这个项目下周五之前能完成吗？

      乙：可以，我会在周三提交初稿，周五提交终稿。

      问题：乙承诺什么时候提交终稿？'
    dimension: dialog
    hints: 周五
  assert:
  - type: llm-rubric
    value: 题目维度：{{dimension}}。参考答案要点：{{hints}}。请判断模型回答是否基本正确，回答基本正确则判为通过。
- vars:
    question: '对话：

      顾客：这款手机有蓝色吗？

      店员：蓝色暂时缺货，我们还有黑色和白色。

      顾客：那我要一台黑色的。

      问题：顾客最终决定购买什么颜色的手机？'
    dimension: dialog
    hints: 黑色
  assert:
  - type: llm-rubric
    value: 题目维度：{{dimension}}。参考答案要点：{{hints}}。请判断模型回答是否基本正确，回答基本正确则判为通过。
- vars:
    question: '请从以下文本中提取所有出现的人名和地名：

      「李明在北京工作，他的同事王芳来自上海。」'
    dimension: extraction
    hints: 李明、王芳、北京、上海
  assert:
  - type: llm-rubric
    value: 题目维度：{{dimension}}。参考答案要点：{{hints}}。请判断模型回答是否基本正确，回答基本正确则判为通过。
- vars:
    question: '请从以下文本中提取所有数字信息：

      「公司 2024 年营收达到 1.5 亿元，同比增长 20%，员工人数从 300 人增长到 450 人。」'
    dimension: extraction
    hints: 2024、1.5、20、300、450
  assert:
  - type: llm-rubric
    value: 题目维度：{{dimension}}。参考答案要点：{{hints}}。请判断模型回答是否基本正确，回答基本正确则判为通过。
- vars:
    question: '请从以下文本中提取公司名称、成立年份和主营业务：

      「字节跳动成立于 2012 年，是一家以短视频和信息分发为主的科技公司。」'
    dimension: extraction
    hints: 字节跳动、2012、短视频
  assert:
  - type: llm-rubric
    value: 题目维度：{{dimension}}。参考答案要点：{{hints}}。请判断模型回答是否基本正确，回答基本正确则判为通过。
defaultTest:
  options:
    provider:
      id: openai:chat:qwen2.5:7b
      config:
        apiBaseUrl: http://localhost:4000/v1
        apiKey: sk-local-eval
